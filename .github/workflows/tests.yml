name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile source tree
        run: python -m compileall -q app tests

      - name: Import runtime modules
        run: python -c "import app.runtime.bootstrap, app.execution.colab_service, app.orchestration.service, app.supervisor.service"

      - name: Run tests
        env:
          UAR_EXECUTION_AUTH_SECRET: uar-ci-test-secret-do-not-use-in-production-2026
        run: python -m unittest discover -s tests -p 'test_*.py' -v
